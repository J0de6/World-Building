<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ór’esař Archive</title>
<style>
:root{--bg:#09110e;--pane:#0f1b17;--ink:#0d1728;--iv:#efe6d0;--mute:#a7a28c;--br:#b08d57;--gl:#8fe9ff;--gr:#2f6b4f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -8%,#16304a66,transparent),var(--bg);color:var(--iv);font:19px/1.7 "Cormorant Garamond","Palatino Linotype",Palatino,Georgia,serif}
a{color:var(--iv)}:focus-visible{outline:2px solid var(--gl);outline-offset:2px}
header.top{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding:.6rem 1.2rem;background:var(--ink);border-bottom:1px solid var(--br)}
.brand{font-size:1.5rem;text-decoration:none;letter-spacing:.04em;color:var(--br)}.brand:before{content:"✦ ";color:var(--gl);text-shadow:0 0 10px var(--gl)}
nav.m a{margin-right:.9rem;text-decoration:none;color:var(--mute)}nav.m a:hover{color:var(--iv)}
#q{background:#0a1220;border:1px solid var(--br);color:var(--iv);padding:.3rem .7rem;font:inherit;border-radius:2px;width:15rem}
#sr{position:absolute;z-index:20;background:var(--ink);border:1px solid var(--br);max-width:26rem}#sr a{display:block;padding:.3rem .8rem;text-decoration:none}#sr a:hover,#sr a:focus{background:#16304a}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1.2rem 4rem}main.wide{max-width:none;padding:0}
h1,h2,h3{font-weight:500;letter-spacing:.02em}h1{font-size:2.6rem;margin:.2rem 0}h2{border-bottom:1px solid var(--br);padding-bottom:.2rem;margin-top:2rem}
small,.mute{color:var(--mute)}.sum{font-size:1.2rem;color:#d9d0b8}
a.ent{color:#dcc99a;text-decoration:underline dotted var(--br);text-underline-offset:3px;transition:color .2s,text-shadow .2s}
a.ent:hover,a.ent:focus{color:#fff;text-shadow:0 0 6px var(--gl),0 0 16px #4fc3ff99}a.dead{color:#c77;text-decoration-style:wavy}
.btn,button,select,input,textarea{font:inherit;color:var(--iv);background:#122019;border:1px solid var(--br);border-radius:2px;padding:.25rem .7rem}
.btn{text-decoration:none;display:inline-block;margin-right:.4rem}button{cursor:pointer}button:hover,.btn:hover{background:#1c3a2c;box-shadow:0 0 8px #8fe9ff55}

.main{max-width:70ch}.info{border:1px solid var(--br);background:var(--pane);padding:.8rem;font-size:.95rem}.info img{width:100%;display:block;margin-bottom:.6rem;border:1px solid var(--br)}
dl{margin:0}dt{color:var(--mute);margin-top:.5rem}dd{margin:0}.toc{border-left:2px solid var(--br);padding-left:.8rem;margin-bottom:1rem}.toc a{display:block;text-decoration:none;color:var(--mute)}.toc .l2{padding-left:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}.card{border:1px solid #3c4f44;background:var(--pane);padding:.7rem;text-decoration:none;display:block}.card:hover{border-color:var(--br);box-shadow:0 0 14px #8fe9ff33}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}.gal img{width:100%}figure{margin:0}figcaption{font-size:.85rem;color:var(--mute)}
#tip{display:none;position:absolute;z-index:50;width:310px;background:var(--ink);border:1px solid var(--br);padding:.6rem;box-shadow:0 0 18px #4fc3ff44;font-size:.9rem;line-height:1.4}#tip img{width:100%;max-height:160px;object-fit:cover}#tip p{margin:.3rem 0 0}
form label{display:block;margin-top:.6rem;color:var(--mute)}form input,form textarea,form select{width:100%;max-width:42rem}textarea{min-height:16rem;font-family:ui-monospace,monospace;font-size:.9rem}
.chip{border-radius:12px;margin:0 .2rem .3rem 0}.chip.on{background:var(--gr)}.picker{border:1px dashed var(--br);padding:.5rem;margin-top:.5rem;max-width:42rem}
.atl{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 56px)}#vp{position:relative;overflow:hidden;background:#04101c;touch-action:none;cursor:grab}#pan{position:absolute;left:0;top:0;width:100%;transform-origin:0 0}
#base{width:100%;display:block;user-select:none;-webkit-user-drag:none}#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%) scale(calc(1/var(--k)));width:18px;height:18px;border-radius:50%;border:2px solid var(--br);background:#0d1728;padding:0}.pin.k-country{border-radius:3px}.pin.k-landmark{transform:translate(-50%,-50%) rotate(45deg) scale(calc(1/var(--k)))}
.pin.sel{border-color:var(--gl);background:var(--gl);box-shadow:0 0 12px 4px #8fe9ffcc;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 22px 8px #8fe9ff88}}
.pin span{position:absolute;left:22px;top:-4px;font-size:13px;white-space:nowrap;color:var(--iv);text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;transform:rotate(0)}.pin.k-landmark span{transform:rotate(-45deg)}
.tok{position:absolute;transform:translate(-50%,-50%) scale(calc(1/var(--k)));width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:#0d1728 center/cover;display:grid;place-items:center;font-size:15px;cursor:grab;box-shadow:0 0 10px var(--c);touch-action:none}
.trace{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.6s ease-out;filter:drop-shadow(0 0 3px var(--c))}@keyframes draw{from{stroke-dashoffset:1}}
.zb{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px}#side{overflow:auto;padding:.8rem;background:var(--pane);border-left:1px solid var(--br);font-size:.9rem;line-height:1.45}#side h3{margin:.8rem 0 .3rem;font-size:1.1rem}#side input,#side select{max-width:100%;width:100%;margin:.15rem 0}
@media(max-width:800px){.cols,.atl{grid-template-columns:1fr}.atl{height:auto}#vp{height:60vh}.cols .info{order:-1;position:static}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="./assets/archive.css"></head><body>
<header class="top">
  <a class="brand" href="#/" aria-label="Ór’esař home">Ór’esař</a>

<p id="archive-error" class="request-error" role="alert" hidden></p><main id="app"><p>Loading the archive…</p><noscript>Enable JavaScript to open the archive.</noscript></main><div id="tip" role="tooltip"></div>
<script type="module">
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],app=$('#app');
const T={character:['Characters',['birthName','species','culture','nationality','faction','rank','occupation','occupationHistory','born','died','age','apparentAge','joined','family']],place:['Countries & places',['kind','region','capital','population']],culture:['Cultures',['homeland','languages','customs']],faction:['Factions',['kind','leader','founded','base']],species:['Species',['lifespan','habitat','traits']],language:['Languages',['family','speakers','script']],myth:['Gods & myths',['kind','domain','symbols']],event:['Events',['date','book','place','participants']]};
const KINDS={partner:'Partner',family:'Family',friend:'Friend',rival:'Rival',ally:'Allegiance'};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f’'`‘]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=k=>k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-');
let S={entries:[],rels:[],journeys:[],map:{}};const byId=i=>S.entries.find(e=>e.id==i);
let archive, readOnly=false, ready=false;
const media=file=>esc(archive.mediaUrl(file));
function showError(message){
  const notice=$('#archive-error');
  notice.textContent=message;
  notice.hidden=false;
}
function useChange({state,record}){
  S={...state,rels:state.relationships};
  return record;
}
const save=async(kind,record)=>useChange(await archive.save(kind,record));
const remove=async(kind,id)=>useChange(await archive.remove(kind,id));
const inline=s=>esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,id,t)=>{id=id.trim();const e=byId(id);return `<a class="ent${e?'':' dead'}" href="#/e/${id}" data-id="${id}">${t||(e?esc(e.title):id)}</a>`}).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const md=t=>String(t||'').split(/\n{2,}/).map(b=>{b=b.trim();let m;if(m=b.match(/^(#{1,2}) (.*)/))return `<h${m[1].length+1} id="${slug(m[2])}">${inline(m[2])}</h${m[1].length+1}>`;if(/^[-*] /.test(b))return'<ul>'+b.split('\n').map(l=>'<li>'+inline(l.replace(/^[-*] /,''))+'</li>').join('')+'</ul>';return b?'<p>'+inline(b).replace(/\n/g,'<br>')+'</p>':''}).join('');
const refsOf=e=>new Set([...JSON.stringify([e.summary,e.body,e.fields]).matchAll(/\[\[([^\]|\\]+)/g)].map(m=>m[1].trim()));
const tgt=e=>e.x!=null?e.id:[...refsOf(e)].map(byId).find(x=>x&&x.x!=null)?.id;
/* hover preview */
const plain=t=>String(t||'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,i,x)=>x||byId(i.trim())?.title||i);const tip=$('#tip');const hideTip=()=>tip.style.display='none';
function showTip(a){const e=byId(a.dataset.id);if(!e)return;tip.innerHTML=(e.cover?`<img src="${media(e.cover)}" alt="">`:'')+`<b>${esc(e.title)}</b> <small>${esc(T[e.type]?.[0]||e.type)}</small><p>${esc(plain(e.summary))}</p>`;const r=a.getBoundingClientRect();tip.style.display='block';tip.style.left=Math.max(4,Math.min(r.left+scrollX,innerWidth-330))+'px';tip.style.top=(r.bottom+scrollY+6)+'px'}
document.addEventListener('mouseover',e=>{const a=e.target.closest('a.ent');a?showTip(a):hideTip()});document.addEventListener('focusin',e=>{const a=e.target.closest?.('a.ent');a?showTip(a):hideTip()});document.addEventListener('keydown',e=>e.key=='Escape'&&hideTip());
document.addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(t){e.preventDefault();document.getElementById(t.dataset.s)?.scrollIntoView({behavior:'smooth'})}});
/* search */
function search(q){const nq=norm(q).trim();if(!nq)return[];return S.entries.map(e=>{const t=norm(e.title+' '+(e.aliases||[]).join(' '));const s=t.startsWith(nq)?0:t.includes(nq)?1:norm(e.summary+' '+e.body+' '+JSON.stringify(e.fields||{})).includes(nq)?2:9;return[s,e]}).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].title.localeCompare(b[1].title)).map(x=>x[1])}
$('#q').addEventListener('input',e=>{const r=search(e.target.value).slice(0,8);$('#sr').innerHTML=r.map(x=>`<a href="#/e/${x.id}">${esc(x.title)} <small>${esc(T[x.type]?.[0]||x.type)}</small></a>`).join('')});
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'){const r=search(e.target.value)[0];if(r){location.hash='#/e/'+r.id;e.target.value='';$('#sr').innerHTML=''}}if(e.key=='ArrowDown')$('#sr a')?.focus()});
$('#sr').addEventListener('click',()=>{$('#q').value='';$('#sr').innerHTML=''});
/* pages */
const scenes={
  camp:{title:'Ar’noirai Main Camp',type:'place',art:'camp',parent:'daranth',accent:'#ab8b52',focal:'65% 50%',features:['council-tree','root-bridges']},
  'al-krasna':{title:'Al-Krasna',type:'place',art:'harbour',parent:'zerakan',accent:'#c3894e',focal:'70% 55%',features:['harbour-map','harbour']},
  daranth:{title:'Daranth',type:'place'},zerakan:{title:'Zerakan',type:'place'},
  'council-tree':{title:'Council Tree',type:'place',art:'council-tree'},
  'root-bridges':{title:'Root bridges',type:'place',art:'root-bridges'},
  harbour:{title:'Harbour',type:'place',art:'harbour-detail'},
  'harbour-map':{title:'Harbour map',type:'place',art:'harbour-map'},
  oresar:{title:'Ór’esař'},tiranog:{title:'Tiř’anÓg'},ashenlogh:{title:'Aşh’enløgħ'},
  'first-three':{title:'The First Three'},'splitting-of-kaos':{title:'The Splitting of Ka’os'},'gods-step-forward':{title:'The Gods Step Forward'}
};
const art=name=>new URL('./assets/scenes/'+name+(name==='harbour-map'?'.webp':'.jpg'),document.baseURI).href;
const findScene=key=>byId(key)||S.entries.find(e=>scenes[key]&&norm(e.title)===norm(scenes[key].title));
const sceneHref=key=>findScene(key)?'#/e/'+encodeURIComponent(findScene(key).id):'#/scene/'+encodeURIComponent(key);
function artwork(value){
  if(typeof value!=='string')return '';
  const scene=value.match(/^(?:\.\/|\/)?(assets\/scenes\/[a-z0-9-]+\.(?:webp|jpg))$/);
  return scene?new URL('./'+scene[1],document.baseURI).href:/^[a-z0-9_.-]+$/i.test(value)?archive.mediaUrl(value):'';
}
const placeFields=['sceneArtwork','sceneFocalPoint','sceneAccent','parentRegion','illustratedFeatures'];
const placeHints={sceneArtwork:'Uploaded filename or bundled scene path',sceneFocalPoint:'65% 50%',sceneAccent:'#ab8b52',parentRegion:'Parent entry ID',illustratedFeatures:'Comma-separated entry IDs'};
function placeOpening(e,design={}){
  const fields=e.fields||{}, parent=(fields.parentRegion||design.parent||(String(fields.region||'').startsWith('[[')?fields.region:'')).replace(/^\[\[|\]\]$/g,'').split('|')[0];
  const focal=/^\d{1,3}% \d{1,3}%$/.test(fields.sceneFocalPoint)?fields.sceneFocalPoint:design.focal||'50% 50%';
  const accent=/^#[a-f0-9]{6}$/i.test(fields.sceneAccent)?fields.sceneAccent:design.accent||'#a6804c';
  const image=artwork(fields.sceneArtwork)||artwork(e.cover)||(design.art?art(design.art):'');
  const keys=fields.illustratedFeatures?fields.illustratedFeatures.split(',').map(v=>v.trim()).filter(Boolean):design.features||[];
  return `<div style="--accent:${accent}"><section class="place-scene${image?'':' no-scene-image'}">${image?`<img src="${esc(image)}" style="--scene-focal:${focal}" alt="" fetchpriority="high">`:''}
    <div class="scene-copy"><h1>${esc(e.title)}</h1><div class="scene-actions">${parent?`<a href="${sceneHref(parent)}">‹ ${esc(findScene(parent)?.title||scenes[parent]?.title||parent)}</a>`:''}
    <a class="btn" href="#/atlas${tgt(e)?'/'+encodeURIComponent(tgt(e)):''}">Open in atlas →</a></div>${e.summary?`<p>${inline(e.summary)}</p>`:''}</div></section>
    ${keys.length?`<div class="place-features">${keys.map(key=>{const linked=findScene(key),spec=scenes[key];const img=artwork(linked?.fields?.sceneArtwork)||artwork(linked?.cover)||(spec?.art?art(spec.art):'');return `<a class="feature" href="${sceneHref(key)}">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:''}<strong>${esc(linked?.title||spec?.title||key)}</strong></a>`}).join('')}</div>`:''}</div>`;
}
function scene(key){
  const saved=findScene(key), spec=scenes[key];
  if(saved)return entry(saved.id);
  if(!spec)return entry(key);
  const edit=readOnly?'Article text has yet to be added.':`<a class="btn" href="#/edit/new:${spec.type||'myth'}/${key}">Add article</a>`;
  if(spec.type==='place'){
    app.classList.add('wide');
    app.innerHTML=placeOpening(spec,spec)+`<div class="reading">${edit}</div>`;
  }else app.innerHTML=`<h1>${esc(spec.title)}</h1><p>${edit}</p>`;
}
function spread(myth){
  app.classList.add('wide');
  const name=myth?'Origins':'The Three Realms',file=art(myth?'origins':'realms');
  const keys=myth?['first-three','splitting-of-kaos','gods-step-forward']:['oresar','tiranog','ashenlogh'];
  app.innerHTML=`<section class="spread ${myth?'myth':''}"><img class="spread-art" src="${file}" alt=""><h1>${name}</h1>
  <div class="spread-grid">${keys.map((key,i)=>{
    const titleId=`spread-title-${i}`;
    const firstMyth=myth&&i===0;
    return `<a class="spread-link" style="--mobile-scene:url('${art((myth?'origins':'realms')+'-'+(i+1))}')" href="${sceneHref(key)}"
      aria-labelledby="${titleId}" ${firstMyth?'aria-describedby="first-three-labels"':''}>
      ${firstMyth?`<span class="origin-annotations" id="first-three-labels"><span>Sky</span><span>First Moon</span><span>Earth</span></span>`:''}
      <strong id="${titleId}">${esc(scenes[key].title)}</strong></a>`;
  }).join('')}</div></section>`;
}
function home(){
  app.classList.add('wide');
  const featuredKeys=['camp','al-krasna'];
  const sections=[...Object.entries(T).map(([key,[title]])=>[key,title,S.entries.filter(e=>e.type===key).length]),['journey','Journeys',S.journeys.length]];
  app.innerHTML=`<section class="archive-hero">
    <img src="${art('archive')}" alt="" fetchpriority="high">
    <div class="archive-hero-copy">
      <h1>The Ór’esař Archive</h1>
      <a class="editorial-link" href="#/realms">Explore the Three Realms <span aria-hidden="true">↗</span></a>
    </div>
  </section>
  <div class="archive-body">
    <div class="archive-directory">
      <h2>Browse the Archive</h2>
      <nav aria-label="Archive sections">${sections.map(([key,title,count])=>`
        <a href="#/t/${key}"><span>${title}</span><span class="directory-detail">${count ? count+' '+(count===1?'entry':'entries') : ''}<span aria-hidden="true"> ↗</span></span></a>`).join('')}
      </nav>
    </div>
    <section class="archive-places" aria-labelledby="featured-places">
      <h2 id="featured-places">Featured Places</h2>
      ${featuredKeys.map(key=>{
        const scene=scenes[key];
        return `<a class="featured-place" href="${sceneHref(key)}">
          <img src="${art(scene.art)}" alt="" loading="lazy">
          <span>${esc(scene.title)} <span aria-hidden="true">↗</span></span>
        </a>`;
      }).join('')}
    </section>
  </div>`;
}
function index(t){if(t=='journey'){app.innerHTML=`<h1>Journeys</h1><p><a class="btn" href="#/board">Open strategy board</a></p><div class="grid">${S.journeys.map(j=>`<a class="card" href="#/board" data-j="${j.id}"><b>${esc(j.title)}</b><br><small>${j.status}</small></a>`).join('')||'<p class="mute">No journeys yet. Create one on the atlas.</p>'}</div>`;$$('[data-j]').forEach(a=>a.onclick=()=>curJ=a.dataset.j);return}
const l=S.entries.filter(e=>e.type==t).sort((a,b)=>a.title.localeCompare(b.title));app.innerHTML=`<h1>${T[t]?.[0]||t}</h1>${readOnly?'':`<p><a class="btn" href="#/edit/new:${t}">New entry</a></p>`}<div class="grid">${l.map(e=>`<a class="card" href="#/e/${e.id}"><b>${esc(e.title)}</b><br><small>${esc(e.summary||'')}</small></a>`).join('')||'<p class="mute">Nothing here yet.</p>'}</div>`}
let rf=null;
function entry(id){const e=byId(id);if(!e)return app.innerHTML=`<h1>Missing entry</h1><p>No entry with id <code>${esc(id)}</code>. <a href="#/">Home</a></p>`;
const f=e.fields||{},heads=[...String(e.body||'').matchAll(/^(#{1,2}) (.+)$/gm)];
const toc=heads.length?`<nav class="toc" aria-label="Contents">${heads.map(m=>`<a href="#" data-s="${slug(m[2])}" class="l${m[1].length}">${esc(m[2])}</a>`).join('')}</nav>`:'';
const t=tgt(e),gal=e.gallery||[],mine=S.rels.filter(r=>r.a==id||r.b==id),shown=mine.filter(r=>!rf||r.kind==rf);
const evs=S.entries.filter(x=>x.type=='event'&&x.id!=id&&refsOf(x).has(id)).sort((a,b)=>compareDates(a.fields?.date,b.fields?.date));
const back=S.entries.filter(x=>x.id!=id&&x.type!='event'&&refsOf(x).has(id));
const fl=(T[e.type]?.[1]||[]).concat(Object.keys(f).filter(k=>!(T[e.type]?.[1]||[]).includes(k)));
const scenic=e.type==='place';
if(scenic)app.classList.add('wide');
const design=Object.values(scenes).find(spec=>norm(spec.title)===norm(e.title))||scenes[e.id];
app.innerHTML=(scenic?placeOpening(e,design)+'<div class="reading">':'')+`<header>${scenic?'':`<small>${T[e.type]?.[0]||e.type}</small><h1>${esc(e.title)}</h1>`}${e.aliases?.length?`<small>Also known as ${esc(e.aliases.join(', '))}</small>`:''}<p class="sum">${inline(e.summary)}</p><p>${readOnly?'':`<a class="btn" href="#/edit/${id}">Edit</a>`}${t&&!scenic?`<a class="btn" href="#/atlas/${t}">Show on map</a>`:''}</p></header>
<div class="cols"><div class="main">${toc}${md(e.body)}

    <details ${editPins||prev?'open':''}><summary>${readOnly?'Map layers':'Map layers and artwork'}</summary>
    <h3>Layers</h3>${Object.keys(layers).filter(l=>board||l!=='journey').map(l=>`<label><input type="checkbox" data-l="${l}" ${layers[l]?'checked':''} style="width:auto"> ${label(l)}</label> `).join('')}
    ${readOnly?'':`<h3>Pins</h3><label><input type="checkbox" id="ep" ${editPins?'checked':''} style="width:auto"> Edit pins (drag, or arrow keys)</label>
    ${editPins||prev?`<select id="pp"><option value="">Place a pin for…</option>${places.filter(p=>p.x==null).map(p=>`<option value="${esc(p.id)}" ${pickPl===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`:''}
    <h3>Base artwork</h3><label>Preview replacement<input type="file" id="mf" accept="image/*"></label>${(S.map.versions||[]).map((v,i)=>`<br><small>${new Date(v.at*1000).toLocaleString()} <button data-rv="${i}">Restore version</button></small>`).join('')}`}</details>${dl()}`;
  $$('[data-l]').forEach(c=>c.onchange=()=>{layers[c.dataset.l]=c.checked;draw(false)});
  if($('#ep'))$('#ep').onchange=e=>{editPins=e.target.checked;draw()};
  if($('#pp'))$('#pp').onchange=e=>pickPl=e.target.value;
  if(board){
    $('#js').onchange=e=>{curJ=e.target.value||null;character=waypointEdit=scrub=null;draw()};
    if($('#nj'))$('#nj').onclick=async()=>{const title=prompt('Journey or storyline name');if(!title?.trim())return;const r=await save('journey',{title:title.trim(),status:'draft',tokens:[]});curJ=r.id;character=waypointEdit=scrub=null;draw()};
  }
  if(j&&!readOnly){
    $('#st').onchange=e=>{j.status=e.target.value;saveJ(j)};
    $('#tc').onclick=async()=>{
      const first=j.tokens.flatMap(t=>t.stops).sort((a,b)=>compareDates(a.date,b.date))[0];
      useChange(await archive.publishJourney(j,{id:'evt-journey-'+j.id,type:'event',title:'Journey: '+j.title,summary:'Canon journey imported from the strategy board.',fields:{date:first?.date||''},body:j.tokens.map(t=>`- [[${t.char}]]: `+t.stops.map(s=>s.place?`[[${s.place}]]`:'free point').join(' → ')).join('\n')}));
      draw();alert('Added to your local timeline as an event.');
    };
    $('#ac').onchange=e=>{if(!e.target.value)return;character=crypto.randomUUID();waypointEdit=null;scrub=null;j.tokens.push({id:character,char:e.target.value,x:.5,y:.5,stops:[]});saveJ(j)};
  }
  if(token){
    $('#character').onchange=e=>{character=e.target.value;waypointEdit=null;draw()};
  }
  if(token&&!readOnly){
    $('#waypoint').onsubmit=ev=>{
      ev.preventDefault();
      const value=$('#we').value.trim(),linked=byId(pickId(value));
      if(value&&!['place','event'].includes(linked?.type)){alert('Choose a place or event from the archive.');return;}
      const [x,y]=trialPositions.get(token.id)||[token.x,token.y];
      const update={...(stop||{x,y}),date:$('#wd').value.trim(),note:$('#wn').value};
      if(!stop||value!==linkedValue(stop.place||stop.event)){
        delete update.place;delete update.event;
        if(linked)update[linked.type]=linked.id;
      }
      if(stop)token.stops[waypointEdit]=update;else{token.stops.push(update);token.x=x;token.y=y;trialPositions.delete(token.id)}
      waypointEdit=null;scrub=null;saveJ(j);
    };
    $$('[data-edit-stop]').forEach(b=>b.onclick=()=>{waypointEdit=+b.dataset.editStop;draw();$('#wd').focus()});
    if($('#cancel-waypoint'))$('#cancel-waypoint').onclick=()=>{waypointEdit=null;draw()};
    $$('[data-remove-stop]').forEach(b=>b.onclick=()=>{token.stops.splice(+b.dataset.removeStop,1);waypointEdit=scrub=null;saveJ(j)});
    $('#remove-character').onclick=()=>{if(confirm('Remove this character and their waypoints from the journey?')){j.tokens=j.tokens.filter(t=>t.id!==token.id);character=waypointEdit=scrub=null;saveJ(j)}};
  }
if($('#mf'))$('#mf').onchange=e=>{const f=e.target.files[0];if(f){try{archive.imageFor(f)}catch(error){return alert(error.message)}if(prev)URL.revokeObjectURL(prev.url);prev={file:f,url:URL.createObjectURL(f)};pend={};atlas('',board)}};
$$('[data-rv]').forEach(a=>a.onclick=async ev=>{ev.preventDefault();const v=S.map.versions[+a.dataset.rv];if(confirm('Restore this artwork and its pin positions? The current version is kept.')){useChange(await archive.restoreMap(v));atlas('',board)}});
if($('#pv-no'))$('#pv-no').onclick=()=>{URL.revokeObjectURL(prev.url);prev=pend=null;atlas('',board)};if($('#pv-save'))$('#pv-save').onclick=async()=>{useChange(await archive.replaceMap(prev.file,pend));URL.revokeObjectURL(prev.url);prev=pend=null;atlas('',board)}}
const place=()=>{
  const height=vp.clientWidth*R();
  if(!view){const k=Math.min(1,vp.clientHeight/height);view={x:(vp.clientWidth-vp.clientWidth*k)/2,y:(vp.clientHeight-height*k)/2,k}}
  const e=focus&&byId(focus);
  if(e&&tgt(e)){sel=tgt(e);const p=byId(sel),k=3.5;view={x:vp.clientWidth/2-p.x*vp.clientWidth*k,y:vp.clientHeight/2-p.y*height*k,k}}
};
img.onload=()=>{place();tf();draw()};if(img.complete&&img.naturalWidth){place();tf();draw()}else tf()}
function route(){hideTip();clearDraftArtwork();const hash=location.hash||'#/';const h=hash.slice(2).split('/').map(part=>{try{return decodeURIComponent(part)}catch{return part}});app.classList.remove('wide');
$$('#nav a').forEach(a=>{const section=['t','e','edit','scene','realms'].includes(h[0])?'':h[0];if(a.hash==='#/'+section)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
$('#sr').replaceChildren();
({'':home,t:index,e:entry,edit:readOnly?home:editor,atlas,board:id=>atlas(id,true),timeline,scene,realms:()=>spread(false),origins:()=>spread(true)}[h[0]]||home)(h[1]||'',h[2])}
async function boot(){
  $('#archive-error').hidden=true;
  try{
    const {loadArchive,openArchive}=await import('./archive-store.js');
    const seed=await loadArchive();
    try{
      archive=await openArchive(seed);
    }catch(error){
      readOnly=true;
      archive={data:seed,mediaUrl:file=>'./assets/'+encodeURIComponent(file)};
      showError('Browser storage is unavailable. You can read the published archive. Editing requires browser storage.');
      console.warn(error);
    }
    useChange({state:archive.data});
    ready=true;
    route();
  }catch(error){
    ready=false;
    app.classList.remove('wide');
    app.innerHTML=`<section role="alert"><h1>Archive unavailable</h1><p>${esc(error.message)}</p><button id="retry">Retry</button></section>`;
    $('#retry').onclick=boot;
  }
}
addEventListener('hashchange',()=>{if(ready)route()});
addEventListener('unhandledrejection',event=>{
  showError(event.reason?.message||'The archive could not save your changes.');
});
boot();
</script></body></html>
